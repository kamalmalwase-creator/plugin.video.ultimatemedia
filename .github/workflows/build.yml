name: Build Kodi Addon

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create ZIP
        run: |
          mkdir -p package/plugin.video.ultimatemedia
          cp addon.xml addon.py package/plugin.video.ultimatemedia/
          cp -r resources package/plugin.video.ultimatemedia/
          cd package
          zip -r plugin.video.ultimatemedia.zip plugin.video.ultimatemedia

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Ultimate-Media-Hub
          path: package/plugin.video.ultimatemedia.zip
